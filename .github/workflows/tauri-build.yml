name: Tauri Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/quality/release-gate.mjs

  build-desktop:
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: windows-latest
            target: windows
          - platform: macos-latest
            target: macos

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate tag version matches tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONFIG_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "Tag version (${TAG_VERSION}) does not match src-tauri/tauri.conf.json (${CONFIG_VERSION})"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Supabase secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Validate Tauri updater signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY (or legacy TAURI_PRIVATE_KEY) secret."
            exit 1
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx tauri build

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== Bundle directory ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle dir found"

      - name: Upload artifacts (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

      - name: Upload artifacts (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.tar.gz.sig

      - name: Upload artifacts (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  build-android:
    needs: verify-ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate tag version matches tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONFIG_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "Tag version (${TAG_VERSION}) does not match src-tauri/tauri.conf.json (${CONFIG_VERSION})"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'tools platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Supabase secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Initialize Android project
        run: npx tauri android init

      - name: Build Android APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx tauri android build

      # Keep mobile build evidence without presenting an unsigned APK as an installer.
      - name: Upload Android development artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-development-artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

  create-release:
    needs: [verify-ci, build-desktop, build-android]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Download Windows release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-artifacts
          path: artifacts
      - name: Download macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-artifacts
          path: artifacts
      - name: Download Linux release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-artifacts
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts"

      - name: Generate latest.json for updater
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"

          require_file() {
            local label="$1"
            local file_path="$2"
            if [ -z "$file_path" ] || [ ! -f "$file_path" ]; then
              echo "Missing ${label}: ${file_path}"
              exit 1
            fi
          }

          WIN_FILE=$(find artifacts -name '*-setup.exe' -type f | head -n1 || true)
          WIN_SIG_FILE="${WIN_FILE}.sig"

          if [ -z "$WIN_FILE" ] || [ ! -f "$WIN_SIG_FILE" ]; then
            WIN_FILE=$(find artifacts -name '*.msi' -type f | head -n1 || true)
            WIN_SIG_FILE="${WIN_FILE}.sig"
          fi

          LINUX_FILE=$(find artifacts -name '*.AppImage' -type f | head -n1 || true)
          LINUX_SIG_FILE="${LINUX_FILE}.sig"

          MAC_FILE=$(find artifacts -name '*.app.tar.gz' -type f | head -n1 || true)
          MAC_SIG_FILE="${MAC_FILE}.sig"

          require_file "windows updater asset" "$WIN_FILE"
          require_file "windows updater signature" "$WIN_SIG_FILE"
          require_file "linux updater asset" "$LINUX_FILE"
          require_file "linux updater signature" "$LINUX_SIG_FILE"
          require_file "macOS updater asset" "$MAC_FILE"
          require_file "macOS updater signature" "$MAC_SIG_FILE"

          WIN_SIG=$(tr -d '\r\n' < "$WIN_SIG_FILE")
          LINUX_SIG=$(tr -d '\r\n' < "$LINUX_SIG_FILE")
          MAC_SIG=$(tr -d '\r\n' < "$MAC_SIG_FILE")

          WIN_URL="$REPO/$(basename "$WIN_FILE")"
          LINUX_URL="$REPO/$(basename "$LINUX_FILE")"
          MAC_URL="$REPO/$(basename "$MAC_FILE")"
          MAC_PLATFORM_KEY="darwin-aarch64"
          if basename "$MAC_FILE" | grep -Eq '(x64|x86_64|amd64)'; then
            MAC_PLATFORM_KEY="darwin-x86_64"
          fi

          cat > artifacts/latest.json << ENDJSON
          {
            "version": "$VERSION",
            "notes": "Momentum $RELEASE_TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": { "signature": "$WIN_SIG", "url": "$WIN_URL" },
              "linux-x86_64": { "signature": "$LINUX_SIG", "url": "$LINUX_URL" },
              "$MAC_PLATFORM_KEY": { "signature": "$MAC_SIG", "url": "$MAC_URL" }
            }
          }
          ENDJSON

          echo "=== latest.json ==="
          cat artifacts/latest.json

      - name: Recheck CI immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/quality/release-gate.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          name: 'Momentum ${{ github.ref_name }}'
          body: |
            ## Download

            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** | `Momentum_*_x64-setup.exe` | Recommended for most users |
            | **Windows** | `Momentum_*_x64_en-US.msi` | For IT/enterprise deployment |
            | **macOS** | `Momentum_*_aarch64.dmg` | Apple Silicon (M1/M2/M3/M4) |
            | **Linux** | `Momentum_*_amd64.AppImage` | Universal, no install needed |
            | **Linux** | `Momentum_*_amd64.deb` | Debian/Ubuntu |
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
