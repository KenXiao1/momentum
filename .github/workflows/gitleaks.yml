name: Gitleaks

on:
  workflow_call:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install verified Gitleaks
        run: |
          set -euo pipefail
          SCANNER_DIR=$(mktemp -d)
          curl --fail --location --retry 3 --output "$SCANNER_DIR/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks
          echo "$SCANNER_DIR" >> "$GITHUB_PATH"
      - name: Scan complete commit range and validate report
        run: npm run security:gitleaks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/quality/gitleaks.json
          if-no-files-found: error
